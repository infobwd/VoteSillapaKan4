name: VoteSillapaKan4 VOTE-1 CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck, tests and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Static scaffold tests
        run: npm test
      - name: Inspect JSX/TSX toolchain
        run: |
          timeout 15s node --input-type=module -e "import('esbuild').then(async m => {const v=await m.transform('const A = () => <div>ok</div>',{loader:'tsx',format:'esm'});console.log('esbuild transform ok:',v.code.length)})"
      - name: Root-path production build with diagnostics
        run: timeout 45s npm run build -- --debug
      - name: Subpath production build
        run: APP_BASE=/vote-staging/ npm run build
      - name: Assert no votes or admin bundle endpoints
        run: |
          ! grep -R -E 'submitBallot|castVote|voteSubmit' src
          test -f dist/index.html

  api-and-db:
    name: PHP contract and isolated MariaDB bootstrap
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: synthetic_ci_only
          MARIADB_DATABASE: vote_ci
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      VOTE_DB_HOST: 127.0.0.1
      VOTE_DB_PORT: '3306'
      VOTE_DB_NAME: vote_ci
      VOTE_DB_USER: root
      VOTE_DB_PASSWORD: synthetic_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - name: PHP syntax checks
        run: |
          find api tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: API contract
        run: php tests/php_contract_test.php
      - name: Verify migration on disposable MariaDB
        run: php tests/db_smoke.php

  vite6-probe:
    name: Diagnostic alternative Vite 6 build (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact base dependencies
        run: npm ci --no-audit --no-fund
      - name: Probe Vite 6 bundler without modifying repository dependencies
        run: |
          npm install --no-save --no-audit --no-fund vite@6.3.6
          timeout 35s npx vite build

  isolate-vite-transform:
    name: Diagnostic source graph probe (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Isolate Vite transform with temporary checkout-only files
        run: |
          mkdir -p .ci-probe
          printf '<!doctype html><html><body><script type="module" src="./entry.js"></script></body></html>\n' > .ci-probe/index.html
          printf 'console.log("probe ok");\n' > .ci-probe/entry.js
          echo "::group::MINIMAL BUILD"
          timeout 16s npx vite build .ci-probe --outDir out || echo "MINIMAL_PROBE_FAILED:$?"
          echo "::endgroup::"
          cp src/main.tsx .ci-main-original.tsx
          printf 'document.getElementById("root").textContent = "Probe";\n' > src/main.tsx
          echo "::group::NO REACT BUILD"
          timeout 16s npx vite build || echo "NO_REACT_PROBE_FAILED:$?"
          echo "::endgroup::"
          mv .ci-main-original.tsx src/main.tsx
          sed -i "/import '.\/styles.css';/d" src/main.tsx
          echo "::group::REACT WITHOUT CSS BUILD"
          timeout 16s npx vite build || echo "REACT_NO_CSS_FAILED:$?"
          echo "::endgroup::"
