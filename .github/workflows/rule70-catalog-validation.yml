name: Historical Sillapa 70 candidate catalog validation

on:
  pull_request:
    paths:
      - 'catalog/rule70/**'
      - 'tools/validate_rule70_catalog.mjs'
      - 'tools/prepare_rule70_options.mjs'
      - 'tests/rule70_*.test.mjs'
      - '.github/workflows/rule70-catalog-validation.yml'
  push:
    branches: [main]
    paths:
      - 'catalog/rule70/**'
      - 'tools/validate_rule70_catalog.mjs'
      - 'tools/prepare_rule70_options.mjs'
      - 'tests/rule70_*.test.mjs'
      - '.github/workflows/rule70-catalog-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate historic candidates and PDF source references
        run: node tools/validate_rule70_catalog.mjs
      - name: Test source coverage and independent option generator
        run: node --test tests/rule70_coverage.test.mjs tests/rule70_options.test.mjs
